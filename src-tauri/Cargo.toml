[package]
name = "ghostlabel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Wireless thermal label printer - no Android app required"
authors = ["Sam Bent <contact@sambent.com>"]
license = "GPL-3.0-only"

[lib]
name = "ghostlabel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
tempfile = "3"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
